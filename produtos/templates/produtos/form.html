{% extends 'base.html' %}

{% block content %}
<h2>{{ 'Editar produto' if produto else 'Novo produto' }}</h2>

<form method="post">
    <div class="mb-3">
        <label for="codigo" class="form-label">Código *</label>
        <input type="text" class="form-control" id="codigo" name="codigo" required
               value="{{ produto.codigo if produto else '' }}">
    </div>

    <div class="mb-3">
        <label for="nome" class="form-label">Nome *</label>
        <input type="text" class="form-control" id="nome" name="nome" required
               value="{{ produto.nome if produto else '' }}">
    </div>

    <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ produto.descricao if produto and produto.descricao else '' }}</textarea>
    </div>

    <div class="mb-3">
        <label for="preco" class="form-label">Preço (R$) *</label>
        <input type="number" step="0.01" min="0" class="form-control" id="preco" name="preco" required
               value="{{ produto.preco if produto else '' }}">
    </div>

    <div class="mb-3">
        <label for="id_categoria" class="form-label">Categoria</label>
        <select class="form-select" id="id_categoria" name="id_categoria">
            <option value="">-- Sem categoria --</option>
            {% for c in categorias %}
            <option value="{{ c.id }}"
                {% if produto and produto.id_categoria == c.id %}selected{% endif %}>
                {{ c.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{{ url_for('produtos.listar') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
