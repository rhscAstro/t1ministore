{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categorias</h2>
    <a href="{{ url_for('categorias.nova') }}" class="btn btn-primary">+ Nova categoria</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for categoria in categorias %}
        <tr>
            <td>{{ categoria.id }}</td>
            <td>{{ categoria.nome }}</td>
            <td>{{ categoria.descricao or '' }}</td>
            <td>
                <a href="{{ url_for('categorias.editar', id=categoria.id) }}"
                   class="btn btn-sm btn-warning">Editar</a>
                <form action="{{ url_for('categorias.excluir', id=categoria.id) }}"
                      method="post" style="display:inline"
                      onsubmit="return confirm('Excluir esta categoria?');">
                    <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="text-center">Nenhuma categoria cadastrada.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
